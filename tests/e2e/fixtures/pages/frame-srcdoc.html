<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame srcdoc fixture</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 8px; }
  h1 { font-size: 22px; margin: 4px 0 8px; }
  p { margin: 4px 0 8px; }
  iframe { display: block; width: 480px; height: 180px; border: 1px solid #999; }
</style>
</head>
<body>
<h1 id="top-heading">Srcdoc frame</h1>
<p>A frame whose document is inlined in the srcdoc attribute, so it has no address of its own.</p>
<iframe id="srcdoc-frame" title="srcdoc frame" width="480" height="180" srcdoc="<!doctype html><html lang='en'><head><meta charset='utf-8'><style>body { font: 16px/1.4 system-ui, sans-serif; margin: 8px; } h2 { font-size: 18px; margin: 4px 0 8px; } p { margin: 8px 0 0; }</style></head><body><h2 id='frame-heading'>Srcdoc frame</h2><label for='frame-field'>Frame note</label> <input type='text' id='frame-field' name='frame-field'> <button type='button' id='frame-button'>Frame action</button><p id='frame-status'>not clicked</p><script>document.getElementById('frame-button').addEventListener('click', function () { document.getElementById('frame-status').textContent = 'clicked'; });</script></body></html>"></iframe>
</body>
</html>
