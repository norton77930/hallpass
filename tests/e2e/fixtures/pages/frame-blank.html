<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame blank fixture</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 8px; }
  h1 { font-size: 22px; margin: 4px 0 8px; }
  p { margin: 4px 0 8px; }
  iframe { display: block; width: 480px; height: 180px; border: 1px solid #999; }
</style>
</head>
<body>
<h1 id="top-heading">About:blank frame</h1>
<p>A frame that stays on about:blank; this page writes its content with script.</p>
<iframe id="blank-frame" title="blank frame" width="480" height="180" src="about:blank"></iframe>
<script>
  (function () {
    var frame = document.getElementById("blank-frame");
    var markup = "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\">" +
      "<style>body { font: 16px/1.4 system-ui, sans-serif; margin: 8px; } h2 { font-size: 18px; margin: 4px 0 8px; } p { margin: 8px 0 0; }</style></head><body>" +
      "<h2 id=\"frame-heading\">Blank frame</h2>" +
      "<label for=\"frame-field\">Frame note</label> <input type=\"text\" id=\"frame-field\" name=\"frame-field\"> " +
      "<button type=\"button\" id=\"frame-button\">Frame action</button>" +
      "<p id=\"frame-status\">not clicked</p></body></html>";
    function fill() {
      var doc = frame.contentDocument;
      if (!doc || doc.getElementById("frame-field")) return;
      doc.open();
      doc.write(markup);
      doc.close();
      doc.getElementById("frame-button").addEventListener("click", function () {
        doc.getElementById("frame-status").textContent = "clicked";
      });
    }
    fill();
    // A load of the initial about:blank can land after the first write; fill again only if it wiped it.
    frame.addEventListener("load", fill);
  })();
</script>
</body>
</html>
